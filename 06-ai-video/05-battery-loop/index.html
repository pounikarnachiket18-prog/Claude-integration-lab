<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>1% Battery</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
  { "imports": { "three": "./node_modules/three/build/three.module.js" } }
</script>
</head>
<body>
<script type="module">
// =====================================================================================
// 1% BATTERY: a 14-second seamless loop, 1920x1080, 60 fps (840 frames).
// Built from the "1% Battery" prompt pack, with our own saffron mascot instead of Clawd.
//
// window.renderAt(t) draws any moment from t alone (a pure function of time), so
// renderAt(14) === renderAt(0) and the loop closes exactly. ?t=3.0 freezes a frame.
// Units: millimetres. The mascot is 20 mm tall, on a desk next to a phone.
// =====================================================================================
import * as THREE from "three";

const W = 1920, H = 1080, LOOP = 14;

// ---------- small math helpers --------------------------------------------------------
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };      // ease in-out
const easeOut = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const easeIn = (x) => Math.pow(clamp01(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
// key(t, [[t0, v0], [t1, v1], ...], ease): eased piecewise interpolation (numbers or vectors)
function key(t, keys, ease = smooth) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, a] = keys[i], [t1, b] = keys[i + 1];
    if (t <= t1) {
      const k = ease((t - t0) / (t1 - t0));
      return typeof a === "number" ? lerp(a, b, k) : a.clone().lerp(b, k);
    }
  }
  return keys[keys.length - 1][1];
}
// a damped spring "kick": 0 → overshoot → settles to 0 (used for the yanks)
const kick = (t, t0, amp, freq = 9, damp = 7) =>
  t < t0 ? 0 : amp * Math.sin((t - t0) * freq) * Math.exp(-(t - t0) * damp);

// ---------- renderer, scene, camera ---------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#120E0C");
// 40 mm lens on a 24 mm-high frame → vertical field of view ≈ 33.4°
const camera = new THREE.PerspectiveCamera(33.4, W / H, 2, 5000);

// ---------- lights: warm lamp key + cool phone glow -----------------------------------
scene.add(new THREE.HemisphereLight("#8A93B8", "#3A2618", 0.55));
const lamp = new THREE.SpotLight("#FFB56B", 3.0, 0, Math.PI / 4, 0.6, 0);
lamp.position.set(-330, 360, -170);
lamp.target.position.set(-90, 0, -40);
lamp.castShadow = true;
lamp.shadow.mapSize.set(2048, 2048);
lamp.shadow.camera.near = 100; lamp.shadow.camera.far = 1200;
lamp.shadow.bias = -0.0005; lamp.shadow.radius = 5;
scene.add(lamp, lamp.target);
const fill = new THREE.DirectionalLight("#FFD9B0", 0.9);       // soft warm fill from the front
fill.position.set(220, 160, 320);
const rim = new THREE.DirectionalLight("#8FA3D6", 0.4);        // cool rim from behind
rim.position.set(-100, 120, -300); scene.add(rim);
scene.add(fill);
const screenGlow = new THREE.PointLight("#FF3B30", 1.4, 170, 0); // colour follows the phone screen
screenGlow.position.set(80, 26, 0);
scene.add(screenGlow);

// ---------- desk + blurred background (monitor, plant, lamp) --------------------------
function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  return tex;
}
const deskTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = "#5A3A24"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 140; i++) {               // seeded wood grain
    const y = (i * 7.31 * 13) % h, a = 0.05 + ((i * 37) % 10) / 120;
    g.strokeStyle = `rgba(30,16,8,${a})`; g.lineWidth = 1 + (i % 4);
    g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin(x / 90 + i) * 6);
    g.stroke();
  }
});
deskTex.wrapS = deskTex.wrapT = THREE.RepeatWrapping; deskTex.repeat.set(3, 3);
const desk = new THREE.Mesh(new THREE.PlaneGeometry(1600, 880),
  new THREE.MeshStandardMaterial({ map: deskTex, roughness: 0.75 }));
desk.rotation.x = -Math.PI / 2; desk.position.set(0, 0, 20); desk.receiveShadow = true;
scene.add(desk);

// Background painted once, then blurred: a cheap, convincing depth of field
const bgTex = canvasTex(2048, 1024, (g, w, h) => {
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, "#1A1420"); grad.addColorStop(1, "#2B1C14"); g.fillStyle = grad; g.fillRect(0, 0, w, h);
  g.filter = "blur(26px)";
  g.fillStyle = "#33405E"; g.fillRect(820, 180, 640, 380);                 // monitor
  g.fillStyle = "#7FA3E6"; g.globalAlpha = 0.35; g.fillRect(850, 210, 580, 320); g.globalAlpha = 1;
  g.fillStyle = "#2A2A30"; g.fillRect(1110, 560, 60, 160);
  g.fillStyle = "#2F5A33";                                                  // plant
  for (let i = 0; i < 9; i++) { g.beginPath(); g.ellipse(360 + Math.cos(i) * 90, 420 + Math.sin(i * 1.7) * 90, 70, 150, i, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = "#6B3E26"; g.fillRect(300, 560, 140, 170);
  g.fillStyle = "#FFC27A"; g.beginPath(); g.ellipse(1700, 330, 120, 90, 0, 0, Math.PI * 2); g.fill(); // lamp shade glow
  g.fillStyle = "rgba(255,190,120,0.35)"; g.beginPath(); g.ellipse(1700, 420, 330, 260, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#3A2A20"; g.fillRect(1690, 400, 20, 330);
});
const bg = new THREE.Mesh(new THREE.PlaneGeometry(2400, 1200), new THREE.MeshBasicMaterial({ map: bgTex }));
bg.position.set(-80, 170, -430); bg.scale.set(0.8, 0.8, 1); scene.add(bg);

// ---------- the phone (lying face-up) ---------------------------------------------------
const PHONE = { x0: 0, x1: 160, z: 37, top: 8 };
const phone = new THREE.Mesh(new THREE.BoxGeometry(160, 8, 74),
  new THREE.MeshStandardMaterial({ color: "#2B2D31", roughness: 0.35, metalness: 0.6 }));
phone.position.set(80, 4, 0); phone.castShadow = phone.receiveShadow = true; scene.add(phone);

const screenCanvas = document.createElement("canvas"); screenCanvas.width = 2048; screenCanvas.height = 930;
const screenTex = new THREE.CanvasTexture(screenCanvas); screenTex.colorSpace = THREE.SRGBColorSpace; screenTex.anisotropy = 8;
const screen = new THREE.Mesh(new THREE.PlaneGeometry(152, 69),
  new THREE.MeshBasicMaterial({ map: screenTex, toneMapped: false }));
screen.rotation.x = -Math.PI / 2; screen.position.set(80, 8.05, 0); scene.add(screen);
let lastScreenKey = "";
function drawScreen(mode, pct, showDigits, flash) {
  const k = `${mode}|${pct}|${showDigits}|${flash.toFixed(2)}`;
  if (k === lastScreenKey) return; lastScreenKey = k;
  const g = screenCanvas.getContext("2d"), w = 2048, h = 930;
  const color = mode === "low" ? "#FF3B30" : "#34C759";
  g.fillStyle = "#08080B"; g.fillRect(0, 0, w, h);
  if (mode === "low") {                                    // low-battery banner
    g.fillStyle = "#2A2A2E"; roundRect(g, 260, 50, 1530, 150, 46); g.fill();
    g.fillStyle = "#FF3B30"; g.font = "700 64px Liberation Sans"; g.fillText("Low Battery", 330, 145);
    g.fillStyle = "#B8B8BE"; g.font = "48px Liberation Sans"; g.fillText("1% battery remaining", 840, 145);
  }
  // battery icon
  g.strokeStyle = color; g.lineWidth = 22; roundRect(g, 560, 330, 720, 340, 60); g.stroke();
  g.fillStyle = color; roundRect(g, 1290, 440, 50, 120, 18); g.fill();
  g.fillRect(590, 360, Math.max(16, 660 * pct / 100 * 2.2), 280);
  if (mode === "charging") {                               // lightning bolt
    g.fillStyle = "#FFFFFF"; g.beginPath();
    g.moveTo(960, 300); g.lineTo(840, 520); g.lineTo(930, 520); g.lineTo(880, 700); g.lineTo(1040, 460); g.lineTo(950, 460); g.lineTo(1010, 300); g.closePath(); g.fill();
  }
  if (showDigits) { g.fillStyle = color; g.font = "700 150px Liberation Sans"; g.fillText(`${pct}%`, 1420, 560); }
  if (flash > 0) { g.fillStyle = `rgba(52,199,89,${flash})`; g.fillRect(0, 0, w, h); }
  screenTex.needsUpdate = true;
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

// ---------- charger brick + plug + cable -----------------------------------------------
const white = new THREE.MeshStandardMaterial({ color: "#F2F2F0", roughness: 0.45 });
const charger = new THREE.Mesh(new THREE.BoxGeometry(32, 26, 30), white);
charger.castShadow = charger.receiveShadow = true; scene.add(charger);
const plug = new THREE.Group();
const plugBody = new THREE.Mesh(new THREE.BoxGeometry(13, 4.5, 7), white); plugBody.position.x = -1.5;
const plugTip = new THREE.Mesh(new THREE.BoxGeometry(5, 2.4, 6), new THREE.MeshStandardMaterial({ color: "#B9BCC2", metalness: 0.9, roughness: 0.3 }));
plugTip.position.x = 7.5;
plugBody.castShadow = plugTip.castShadow = true;
plug.add(plugBody, plugTip); scene.add(plug);
let cableMesh = null;
const cableMat = new THREE.MeshStandardMaterial({ color: "#EDEDEA", roughness: 0.5 });

// Geometry of the setup (desk plane y = 0, phone port at x = 0)
const PORT_PLUG_CENTER = V(-7.5, 4, 0);                     // plug centre when plugged in
const P0 = V(-104, 2.3, -24);                               // plug resting spot (frame 0)
const DIR = PORT_PLUG_CENTER.clone().sub(P0).setY(0).normalize(); // plug axis: points at the port
const DRAG_LEN = PORT_PLUG_CENTER.clone().sub(P0).setY(0).length();
const CH0 = V(-190, 13, -150);                              // charger at rest (back of desk)
const RELIEF = 6;                                           // 6 mm straight strain relief
const plugBack = (c) => c.clone().addScaledVector(DIR, -8);   // where the cable leaves the plug
const cableStart = (c) => plugBack(c).addScaledVector(DIR, -RELIEF).setY(1.6);
const chargerOut = (ch) => ch.clone().add(V(17, -11.4, 6));   // cable exits the charger's front side
// Cable length: 15 mm too short to reach the port while the charger stays put
const CABLE_LEN = cableStart(PORT_PLUG_CENTER).distanceTo(chargerOut(CH0)) - 15;
const S_TAUT = (() => {                                     // how far along the drag the cable goes taut
  let lo = 0, hi = DRAG_LEN;
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; const c = P0.clone().addScaledVector(DIR, m).setY(2.3);
    cableStart(c).distanceTo(chargerOut(CH0)) > CABLE_LEN ? (hi = m) : (lo = m); }
  return lo;
})();

// The cable is SOLVED from its length every frame: 6 mm straight out of the plug,
// then one smooth curve to the charger. The sideways bow is found by bisection so the
// curve's length equals the fixed cable length. Always bows away from the hero (−z side).
function cableCurve(start, end) {
  const chord = end.clone().sub(start); const d = chord.length();
  const out = DIR.clone().multiplyScalar(-1);
  const into = start.clone().sub(end).setY(0).normalize();
  const side = V(-chord.z, 0, chord.x).normalize(); if (side.z > 0) side.multiplyScalar(-1);
  const build = (b) => {
    const h = Math.min(30, d / 3);
    return new THREE.CubicBezierCurve3(start,
      start.clone().addScaledVector(out, h).addScaledVector(side, b),
      end.clone().addScaledVector(into, h * 0.6).addScaledVector(side, b * 0.7), end);
  };
  if (build(0).getLength() >= CABLE_LEN) return build(0);   // taut: no slack left
  let lo = 0, hi = 200;
  for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; build(m).getLength() > CABLE_LEN ? (hi = m) : (lo = m); }
  return build(lo);
}

// ---------- the mascot (our own saffron character, 20 mm tall) ---------------------------
const SAFFRON = new THREE.MeshStandardMaterial({ color: "#F08A2E", roughness: 0.55 });
const hero = new THREE.Group();          // position on the desk + facing direction
const lean = new THREE.Group();          // pivots at the feet: leaning and flopping
hero.add(lean); scene.add(hero);
const body = new THREE.Mesh(new THREE.SphereGeometry(7, 40, 32), SAFFRON);
body.scale.set(1, 1.28, 0.92); body.position.y = 10.5; body.castShadow = true; lean.add(body);
const nubs = [-1, 1].map((s) => { const m = new THREE.Mesh(new THREE.SphereGeometry(2.3, 20, 16), SAFFRON); m.castShadow = true; lean.add(m); return m; });
const feet = [-1, 1].map((s) => { const m = new THREE.Mesh(new THREE.CapsuleGeometry(1.6, 2.6, 6, 12), SAFFRON); m.rotation.x = Math.PI / 2; m.castShadow = true; hero.add(m); return m; });
const faceCanvas = document.createElement("canvas"); faceCanvas.width = 512; faceCanvas.height = 320;
const faceTex = new THREE.CanvasTexture(faceCanvas); faceTex.colorSpace = THREE.SRGBColorSpace;
const face = new THREE.Mesh(new THREE.PlaneGeometry(10, 6.25), new THREE.MeshBasicMaterial({ map: faceTex, transparent: true }));
face.position.set(0, 12.3, 6.35); lean.add(face);
const sweat = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), new THREE.MeshStandardMaterial({ color: "#9FD8FF", roughness: 0.1, transparent: true, opacity: 0.9 }));
sweat.scale.set(0.8, 1.3, 0.8); lean.add(sweat);
let lastFace = "";
function drawFace(expr) {                // eyes and mouth drawn as 2D lines on the face
  if (expr === lastFace) return; lastFace = expr;
  const g = faceCanvas.getContext("2d"); g.clearRect(0, 0, 512, 320);
  g.strokeStyle = g.fillStyle = "#1B120C"; g.lineWidth = 26; g.lineCap = g.lineJoin = "round";
  const L = 150, R = 362, Y = 130;
  const chevron = (x, dir) => { g.beginPath(); g.moveTo(x - 40 * dir, Y - 40); g.lineTo(x + 30 * dir, Y); g.lineTo(x - 40 * dir, Y + 40); g.stroke(); };
  const oval = (x, ry = 42) => { g.beginPath(); g.ellipse(x, Y, 26, ry, 0, 0, Math.PI * 2); g.fill(); };
  const line = (x, y = Y) => { g.beginPath(); g.moveTo(x - 38, y); g.lineTo(x + 38, y); g.stroke(); };
  const arc = (x) => { g.beginPath(); g.arc(x, Y + 25, 38, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); };
  if (expr === "panic" || expr === "effort") { chevron(L, 1); chevron(R, -1); }
  else if (expr === "blink") { line(L); line(R); }
  else if (expr === "surprised") { g.lineWidth = 18; g.beginPath(); g.arc(L, Y, 40, 0, 7); g.stroke(); g.beginPath(); g.arc(R, Y, 40, 0, 7); g.stroke(); }
  else if (expr === "relief") { arc(L); arc(R); }
  else if (expr === "twitch") { oval(L); line(R, Y + 6); }
  else if (expr === "annoyed") { line(L, Y + 10); line(R, Y + 10); g.lineWidth = 16; g.beginPath(); g.moveTo(L - 40, Y - 30); g.lineTo(L + 40, Y - 14); g.moveTo(R + 40, Y - 30); g.lineTo(R - 40, Y - 14); g.stroke(); }
  else { oval(L); oval(R); }
  g.lineWidth = 16;                                       // mouth
  if (expr === "panic") { g.beginPath(); g.ellipse(256, 262, 26, 32, 0, 0, 7); g.fill(); }
  else if (expr === "effort") { g.beginPath(); g.moveTo(205, 262); g.lineTo(307, 262); g.stroke(); }
  else if (expr === "relief" || expr === "surprised") { g.beginPath(); g.arc(256, 238, 36, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke(); }
  else if (expr === "annoyed") { g.beginPath(); g.moveTo(222, 268); g.lineTo(290, 258); g.stroke(); }
  else { g.beginPath(); g.moveTo(230, 262); g.lineTo(282, 262); g.stroke(); }
  faceTex.needsUpdate = true;
}

// ---------- the story, as positions over time -------------------------------------------
const M0 = V(-4, 0, 50);                       // frame-0 spot: peeking at the phone's corner
const SIDE = V(-DIR.z, 0, DIR.x).normalize();               // perpendicular to the drag, towards the camera
const hold = (c) => c.clone().addScaledVector(DIR, 1).addScaledVector(SIDE, 15).setY(0); // he walks beside the plug, facing the phone
const FLOP = V(-16, 0, 30);

// How far along the drag the plug is (0 = resting spot, DRAG_LEN = plugged in)
function plugS(t) {
  if (t < 2.12 || t >= 13.62) return 0;
  if (t < 13.25) {
    let s = key(t, [[2.12, 0], [3.2, S_TAUT], [3.44, S_TAUT - 16], [4.7, S_TAUT], [4.86, S_TAUT - 20], [6.0, S_TAUT - 6], [6.62, S_TAUT - 2]]);
    s += kick(t, 3.2, -3) + kick(t, 4.86, -3);
    if (t >= 6.62) {                            // the final effort: inching forward in 6 pushes
      const steps = 6, k = clamp01((t - 6.62) / (9.45 - 6.62)) * steps, i = Math.floor(k), f = k - i;
      s = lerp(S_TAUT - 2, DRAG_LEN - 1.2, (Math.min(i, steps) + (i < steps ? smooth(f) : 0)) / steps);
    }
    if (t >= 9.45) s = key(t, [[9.45, DRAG_LEN - 1.2], [9.6, DRAG_LEN]], easeIn);
    return s;
  }
  return key(t, [[13.25, DRAG_LEN], [13.62, 0]], easeOut);   // unplugged: the cable springs it back
}
function plugCenter(t) { return P0.clone().addScaledVector(DIR, plugS(t)).setY(t >= 9.6 && t < 13.25 ? 4 : 2.3); }
function chargerPos(t) {                         // the charger slides only when the cable is stretched
  const start = cableStart(plugCenter(t)); const out = chargerOut(CH0);
  if (start.distanceTo(out) <= CABLE_LEN + 0.01) return CH0.clone();
  const dir = out.clone().sub(start).setY(0).normalize();
  return start.clone().addScaledVector(dir, CABLE_LEN).sub(V(17, -11.4, 6)).setY(13);
}
function heroPos(t) {
  const grab = hold(P0);
  if (t < 0.62) return M0.clone();
  if (t < 1.76) {                                // the run, around the phone's corner
    const k = smooth((t - 0.62) / 1.14);
    const mid = V(-60, 0, 40);
    return new THREE.QuadraticBezierCurve3(M0, mid, grab).getPoint(k);
  }
  if (t < 9.6) return hold(plugCenter(t));
  if (t < 10.15) return key(t, [[9.6, hold(PORT_PLUG_CENTER)], [10.15, FLOP]]);
  if (t < 13.0) return FLOP.clone();
  if (t < 13.25) return key(t, [[13.0, FLOP], [13.25, hold(PORT_PLUG_CENTER)]]);
  if (t < 13.62) return hold(PORT_PLUG_CENTER).lerp(V(-14, 0, 34), smooth((t - 13.25) / 0.37));
  return key(t, [[13.62, V(-14, 0, 34)], [14.0, M0]]);
}
const yawTo = (from, to) => Math.atan2(to.x - from.x, to.z - from.z);
function heroYaw(t) {
  const facePull = yawTo(V(0, 0, 0), DIR);                             // facing the phone, pulling
  const facePlug = yawTo(V(0, 0, 0), SIDE.clone().multiplyScalar(-1)); // turned towards the plug
  const peek = 0.45;                                                    // mostly towards the camera, face visible
  const toCam = yawTo(FLOP, camState(t).pos);
  return key(t, [[0, peek], [0.62, peek], [0.8, yawTo(M0, hold(P0))], [1.6, yawTo(M0, hold(P0))], [1.8, facePlug], [2.1, facePull],
    [9.6, facePull], [10.0, toCam], [12.45, toCam], [12.55, toCam], [13.0, facePlug], [13.4, facePlug], [13.8, peek], [14, peek]]);
}
function heroLean(t) {                            // radians: positive = leaning forward, negative = backward
  if (t < 2.12) return 0;
  if (t < 6.62) return 0.3 + 0.05 * Math.sin(t * 9) - kick(t, 3.2, 0.55) - kick(t, 4.86, 0.6); // yanks throw him back
  if (t < 9.6) return key(t, [[6.62, 0.35], [7.0, 0.61], [9.6, 0.61]]);   // 35° forward lean
  if (t < 10.15) return key(t, [[9.6, 0.61], [9.9, 0]]);
  if (t < 10.62) return key(t, [[10.15, 0], [10.62, -Math.PI / 2]], easeIn);  // flop onto his back
  if (t < 11.6) return -Math.PI / 2 + 0.08 * Math.max(0, Math.sin((t - 10.62) * 14) * Math.exp(-(t - 10.62) * 8));
  if (t < 12.05) return key(t, [[11.6, -Math.PI / 2], [12.05, 0]]);          // gets back up
  if (t < 13.25) return key(t, [[13.1, 0], [13.25, -0.45]]);                 // yanks it out (leans back)
  return key(t, [[13.25, -0.45], [13.62, 0]]);
}
function expression(t) {
  const blink = (t % 3.1) > 3.0 && !(t > 6 && t < 9.6) && !(t > 10.1 && t < 11.7);
  if (t < 6.0) return blink ? "blink" : "panic";
  if (t < 9.6) return "effort";
  if (t < 10.05) return "surprised";
  if (t < 12.0) return blink ? "blink" : "relief";
  if ((t > 12.12 && t < 12.2) || (t > 12.38 && t < 12.46)) return "twitch";
  if (t < 12.5) return "normal";
  if (t < 13.2) return "annoyed";
  return "panic";
}
const moving = (t) => (t > 0.62 && t < 1.76) || (t > 2.12 && t < 9.45 && Math.abs(plugS(t + 0.02) - plugS(t - 0.02)) > 0.08) || (t > 9.6 && t < 10.15) || (t > 13.0 && t < 14);

// ---------- camera: one job per beat, every move eased, ends exactly on frame 0 --------------
const CAM = [
  [0.0, V(14, 58, 150), V(52, 5, 22)],     // close on the screen ("1%") + his face at the edge
  [0.5, V(14, 58, 150), V(52, 5, 22)],
  [1.3, V(-8, 36, 140), V(-48, 8, 20)],    // follows the run (he fills > 20 % of the frame)
  [2.1, V(-20, 34, 84), V(-92, 6, -14)],   // at the plug, as he turns to pull
  [4.0, V(26, 36, 88), V(-62, 7, -6)],     // from the phone's side: his face, the plug, the cable behind him
  [6.4, V(40, 38, 96), V(-40, 6, -4)],
  [9.2, V(34, 52, 104), V(-8, 6, 6)],      // medium on the click: plug + face both in view
  [10.0, V(34, 52, 104), V(-8, 6, 6)],
  [10.7, V(-12, 104, 88), V(-16, 0, 26)],  // high over his feet for the flop
  [11.7, V(-12, 104, 88), V(-16, 0, 26)],
  [12.6, V(0, 24, 82), V(-16, 11, 30)],    // close-up for the twitch + the look into the lens
  [13.0, V(0, 24, 82), V(-16, 11, 30)],
  [14.0, V(14, 58, 150), V(52, 5, 22)],    // back to frame 0
];
function camState(t) {
  return { pos: key(t, CAM.map(([k, p]) => [k, p])), target: key(t, CAM.map(([k, , g]) => [k, g])) };
}

// ---------- renderAt(t): draws ANY moment from t alone ----------------------------------
window.renderAt = (tIn) => {
  const t = ((tIn % LOOP) + LOOP) % LOOP;
  // camera
  const cam = camState(t); camera.position.copy(cam.pos); camera.lookAt(cam.target);
  // phone screen + glow colour
  const charging = t >= 9.6 && t < 13.25;
  const pct = charging && t >= 11.3 ? 2 : 1;
  const blinkOn = charging || (t % 0.5) < 0.32;
  const flash = charging ? Math.max(0, 1 - (t - 9.6) / 0.35) * 0.55 : 0;
  drawScreen(charging ? "charging" : "low", pct, blinkOn, flash);
  screenGlow.color.set(charging ? "#34C759" : "#FF3B30");
  screenGlow.intensity = charging ? 1.6 : (blinkOn ? 1.4 : 0.9);
  // plug, charger, cable
  const pc = plugCenter(t);
  plug.position.copy(pc); plug.rotation.y = -Math.atan2(DIR.z, DIR.x);
  const ch = chargerPos(t); charger.position.copy(ch);
  charger.rotation.y = 0.35;
  const start = cableStart(pc), end = chargerOut(ch);
  const curve = cableCurve(start, end);
  const pts = [plugBack(pc).setY(start.y + (pc.y - 2.3) * 0.6), ...curve.getPoints(80)];
  if (cableMesh) { cableMesh.geometry.dispose(); scene.remove(cableMesh); }
  cableMesh = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 160, 1.5, 10, false), cableMat);
  cableMesh.castShadow = true; scene.add(cableMesh);
  // hero
  const hp = heroPos(t); hero.position.copy(hp); hero.rotation.y = heroYaw(t);
  const lb = heroLean(t);
  lean.rotation.x = lb;                                  // + forward lean, − backward (flop)
  const mov = moving(t), phase = t * (t < 2 ? 22 : 15);
  const breathe = 1 + 0.025 * Math.sin(t * 2 * Math.PI * 0.8);
  body.scale.set(1, 1.28 * breathe, 0.92);
  lean.position.y = mov ? Math.abs(Math.sin(phase)) * 1.2 : 0;
  feet.forEach((f, i) => { const s = i ? 1 : -1; f.position.set(s * 3.2, 1.6, (mov ? Math.sin(phase + i * Math.PI) * 3 : 0) + 1.5); });
  const grabbing = t > 1.8 && t < 9.7 || (t > 13.15 && t < 13.35);
  nubs.forEach((n, i) => { const s = i ? 1 : -1;
    n.position.set(s * 7.4 + (grabbing ? -1.5 : 0), grabbing ? 8 : 8.5 + Math.sin(t * 5 + i) * 0.4, grabbing ? -2.5 : 0.5); });
  drawFace(expression(t));
  const sweating = (t > 0.3 && t < 9.6) || t > 13.3;
  sweat.visible = sweating;
  sweat.position.set(6.2, 17 - ((t * 0.8) % 1) * 4, 2.5);
  renderer.render(scene, camera);
};

// ?t= freezes one frame; otherwise play in real time
const params = new URLSearchParams(location.search);
if (params.has("t")) { window.renderAt(parseFloat(params.get("t"))); window.__ready = true; }
else { const t0 = performance.now(); const loop = () => { window.renderAt((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; loop(); window.__ready = true; }
</script>
</body>
